name: Build docs
on:
  pull_request:
  push:
    branches: [master]
jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build # fails on broken internal links (starlight-links-validator)
